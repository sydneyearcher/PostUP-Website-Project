<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PostUp</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@100;300;400;500&family=Oswald:wght@400;600&family=Anton&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <!-- Loading Screen (Logo only) -->
    <div id="loadingScreen">
      <img src="images/PostUp LOGO.png" alt="PostUp Logo" class="logo" />
    </div>

    <!-- Main Content Page (Second page after transition) -->
    <div id="mainContentSection">
      <!-- Logo centered above the "What's the Move?" text -->
      <img src="images/PostUp LOGO.png" alt="PostUp Logo" class="login-logo" />

      <!-- "What's the Move?" Text -->
      <h1>
        <span class="whats-the">WHAT'S</span>
        <span class="the">THE</span>
        <span class="move">MOVE?</span>
      </h1>

      <!-- Login Form -->
      <input class="input-field" type="text" placeholder="USERNAME" />
      <input class="input-field" type="password" placeholder="PASSWORD" />
      <a href="explore.html" class="btn" id="loginButton">LOGIN</a>
      <a href="signup.html" class="btn" id="signupButton">SIGN UP</a>
    </div>

    <script src="scripts.js"></script>
  </body>
</html>
