<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PostUp - Profile</title>
    <link
    href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@100;300;400;500&family=Oswald:wght@400;600&family=Anton&display=swap"
    rel="stylesheet"
    />
    <link rel="stylesheet" href="profile.css" />
  </head>
  <body>
    <!-- Logo Positioned Outside Navbar -->
    <div class="nav-logo">
      <a href="index.html"
        ><img src="images/PostUp LOGO.png" alt="PostUP Logo"
      /></a>
    </div>

    <!-- Navigation Bar -->
    <div class="navbar-container">
      <nav class="navbar">
        <ul class="nav-links">
          <li><a href="explore.html">EXPLORE</a></li>
          <li><a href="#">EVENTS</a></li>
          <li><a href="#" class="active">PROFILE</a></li>
          <li><a href="index.html" class="logout-btn">LOGOUT</a></li>
        </ul>
      </nav>
    </div>

    <!-- Profile Page Header -->
    <h1 class="profile-header">PROFILE</h1>

    <!-- Profile Section -->
    <div class="profile-section">
      <!-- User Information Above Profile Image -->
      <div class="user-info">
        <h2 class="user-name">JOHN DOE</h2>
        <p class="user-location">ORLANDO, FL</p>
      </div>

      <!-- Profile Picture -->
      <div class="profile-img-container">
        <img src="images/profileicon.png" alt="User Profile Picture" class="profile-img" />
      </div>

      <!-- Edit Profile Button -->
<div class="edit-profile-btn">
    <a href="editprofile.html">
      <button class="edit-btn">Edit Profile</button>
    </a>
  </div>

    <script src="scripts.js"></script>
  </body>
</html>
