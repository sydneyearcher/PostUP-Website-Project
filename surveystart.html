<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PostUp - Start Survey</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@100;300;400;500&family=Oswald:wght@400;600&family=Anton&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="surveystart.css" />
  </head>
  <body>
    <!-- Main Content Section for Survey Start Page -->
    <div id="surveyStartPage">
      <!-- Logo -->
      <div class="logo-container">
        <img src="images/PostUp LOGO.png" alt="PostUp Logo" class="logo" />
      </div>

      <br />
      <br />

      <!-- Main Title -->
      <div class="main-title">
        <h1>LET'S PERSONALIZE YOUR EXPERIENCE!</h1>
      </div>

      <br />
      <br />

      <!-- Description Text -->
      <div class="description-text">
        <p>ANSWER A FEW QUICK QUESTIONS SO WE CAN RECOMMEND EVENTS JUST FOR</p>
      </div>

      <!-- Image Spot for Text/Image -->
      <div class="image-container">
        <img src="images/YOU.png" alt="Survey Image" class="survey-image" />
      </div>

      <!-- Get Started Button -->
      <button id="getStartedBtn" class="get-started-btn">GET STARTED</button>
    </div>

    <script src="surveystart.js"></script>
  </body>
</html>
