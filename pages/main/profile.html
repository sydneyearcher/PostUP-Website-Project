<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PostUP - Profile</title>
    <link rel="stylesheet" href="../../css/global/navbar.css" />
    <link rel="stylesheet" href="../../css/main_style/profile.css" />
    <link rel="stylesheet" href="../../css/global/globals.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@100;300;400;500&family=Oswald:wght@400;600&family=Anton&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  </head>
  <body>
    <!-- Logo Positioned Outside Navbar -->
    <div class="nav-logo">
      <a href="../../index.html"
        ><img src="../../images/PostUp LOGO.png" alt="PostUP Logo"
      /></a>
    </div>

    <!-- Navigation Bar -->
    <header class="navbar-container">
      <nav class="navbar">
        <ul class="nav-links">
          <li><a href="explore.html" class="explore-nav-link"><i class="fas fa-compass"></i> EXPLORE</a></li>
          <li><a href="saved_events.html" class="saved-nav-link"><i class="fas fa-calendar-alt"></i> EVENTS</a></li>
          <li><a href="rewards.html" class="rewards-nav-link"><i class="fas fa-gift"></i>REWARDS</a></li>
          <li><a href="profile.html" class="profile-nav-link active"><i class="fas fa-user"></i> PROFILE</a></li>
          <!-- <li><a href="../../index.html" class="logout-btn" id="logoutButton"><i class="fas fa-sign-out-alt"></i> LOGOUT</a></li> -->
        </ul>
      </nav>
    </header>

    <main>
      <section class="profile-info" id="profile-top">
        <!-- profile info -->
        <div id="profile-info">
          <h3 class="profile-name">
            Loading Profile Information...
          </h3>
          <svg version="1.1" id="L9" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
            viewBox="0 0 100 100" enable-background="new 0 0 0 0" xml:space="preserve">
              <path fill="#000" d="M73,50c0-12.7-10.3-23-23-23S27,37.3,27,50 M30.9,50c0-10.5,8.5-19.1,19.1-19.1S69.1,39.5,69.1,50">
              <animateTransform 
                attributeName="transform" 
                attributeType="XML" 
                type="rotate"
                dur="1s" 
                from="0 50 50"
                to="360 50 50" 
                repeatCount="indefinite" />
            </path>
          </svg>
          <div class="profile-buttons">
            <a href="../profile/profilesettings.html" class="profile-btn"><i class="fas fa-user-gear"></i> PROFILE SETTINGS</a>
            <a href="../profile/create.html" class="profile-btn"><i class="fa-solid fa-square-plus"></i> CREATE EVENT</a>
          </div>
        </div>
      </section>
  
  
      <section class="profile-stats">
        <div class="stat-box">
          <h4><span class="profile-attended-events-counter">0</span> <i class="fas fa-map-location-dot"></i></h4>
          <p>EVENTS ATTENDED </p>
        </div>
  
        <div class="stat-box">
          <h4><span class="profile-points-counter">0</span> <i class="fas fa-coins"></i></h4>
          <p>POINTS EARNED </p>
        </div>
  
        <div class="stat-box">
          <h4><span class="profile-followers-counter">0</span> <i class="fas fa-users"></i></h4>
          <p>FOLLOWERS </p>
        </div>
  
      </section>
  
      <section class="events-section">
        <h3>UPCOMING EVENTS</h3>
        <div class="upcoming-events">
          <div class="event-card">
            <figure class="event-image">
              <img src="../../images/nessabarrett.png" alt="Nessa Barrett Concert" />
            </figure>
            <div class="event-details">
              <h4>NESSA BARRETT</h4>
              <p><i class="fa-regular fa-calendar-days"></i> November 8, 2025</p>
            </div>
          </div>
          <div class="event-card">
            <figure class="event-image">
              <img src="../../images/coldvisions.png" alt="Bladee Concert" />
            </figure>
            <div class="event-details">
              <h4>BLADEE</h4>
              <p><i class="fa-regular fa-calendar-days"></i> November 18, 2025</p>
            </div>
          </div>
        </div>
        <br />
        <br />
        <button class="view-tickets-btn">VIEW ACTIVE TICKETS</button>
      </section> 
    </main>

    <script src="../../js/supabase.js"></script>
    <script src="../../js/util/checkUser.js"></script>
    <script src="../../js/scripts.js"></script>
    <script src="../../js/user/profile.js"></script>
  </body>
</html>
