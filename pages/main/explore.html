<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PostUP - Explore</title>
    
    <link rel="stylesheet" href="../../css/global/navbar.css" />
    <link rel="stylesheet" href="../../css/main_style/explore.css" />
    <link rel="stylesheet" href="../../css/global/globals.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@100;300;400;500&family=Oswald:wght@400;600&family=Anton&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  </head>
  <body>
    <!-- Logo Positioned Outside Navbar -->
    <div class="nav-logo">
      <a href="../../index.html"
        ><img src="../../images/PostUp LOGO.png" alt="PostUP Logo"
      /></a>
    </div>

    <!-- Navigation Bar -->
    <header class="navbar-container">
      <nav class="navbar">
        <ul class="nav-links">
          <li><a href="explore.html" class="explore-nav-link active"><i class="fas fa-compass"></i> EXPLORE</a></li>
          <li><a href="saved_events.html" class="saved-nav-link"><i class="fas fa-calendar-alt"></i> EVENTS</a></li>
          <li><a href="rewards.html" class="rewards-nav-link"><i class="fas fa-gift"></i>REWARDS</a></li>
          <li><a href="profile.html" class="profile-nav-link"><i class="fas fa-user"></i>PROFILE</a></li>
          <!-- <li><a href="../../index.html" class="logout-btn" id="logoutButton"><i class="fas fa-sign-out-alt"></i> LOGOUT</a></li> -->
        </ul>
      </nav>
    </header>

    <main>
      <!-- Header for Explore Page -->
      <div class="explore-header-container">
        <h1 class="explore-header">Explore Events near</h1>
        <div class="location-container">
          <p class="location-icon">
            <i class="fas fa-map-marker-alt"></i>
            <span class="location-text"> Orlando, FL</span>
          </p>
        </div>
        <!-- Search Bar -->
        <div class="search-container">
          <input
            type="text"
            class="search-bar"
            placeholder="Search for events..."
          />
          <button class="search-btn">
            <span class="sr-only">Search</span>
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>
      </div>
      <div class="allfilters-container">
        <div class="filter-options">
          <!-- Filter button for mobile -->
          <button class="filter-button">
            <i class="fas fa-filter"></i> Filters
          </button>
          
          <!-- Advanced filters for desktop -->
          <div class="advanced-filters">
            <div class="filter-dropdown">
              <select name="distance" id="distance">
                <option value="">Distance</option>
                <option value="5miles">5 miles</option>
                <option value="10miles">10 miles</option>
                <option value="25miles">25 miles</option>
                <option value="50miles">50+ miles</option>
              </select>
            </div>
            
            <div class="filter-dropdown">
              <select name="date" id="date">
                <option value="">Date</option>
                <option value="today">Today</option>
                <option value="tomorrow">Tomorrow</option>
                <option value="thisweek">This Week</option>
                <option value="thismonth">This Month</option>
              </select>
            </div>
            
            <div class="filter-dropdown">
              <select name="admission" id="admission">
                <option value="">Admission</option>
                <option value="free">Free</option>
                <option value="paid">Paid</option>
                <option value="donation">Donation</option>
              </select>
            </div>
          </div>
        </div>
  
        <!-- Category Filters -->
        <div class="filter-container">
          <ul class="category-scroll">
            <li class="filter-link">
              <button class="filter-item">
                <i class="filter-icon" >
                  <img
                    src="../../images/musiclogo.png"
                    alt="Live Music"
                  />
                </i>
                <span>Live Music</span>
              </button>
            </li>
  
            <li class="filter-link">
              <button class="filter-item">
                <i class="filter-icon" >
                  <img
                    src="../../images/foodicon.png"
                    alt="Food Market"
                  />
                </i>
                <span>Food Market</span>
              </button>
            </li>
  
            <li class="filter-link">
              <button class="filter-item">
                <i class="filter-icon" >
                  <img src="../../images/articon.png" alt="Art Market" />
                </i>
                <span>Art Market</span>
              </button>
            </li>
  
            <li class="filter-link">
              <button class="filter-item">
                <i class="filter-icon" >
                  <img
                    src="../../images/festivalicon.png"
                    alt="Festivals"
                    class="filter-icon"
                  />
                </i>
                <span>Festivals</span>
              </button>
            </li>
  
            <li class="filter-link">
              <button class="filter-item">
                <i class="filter-icon" >
                  <img src="../../images/sporticon.png" alt="Sports"/>
                </i>
                <span>Sports</span>
              </button>
            </li>
  
            <li class="filter-link">
              <button class="filter-item">
                <i class="filter-icon" >
                  <img
                    src="../../images/othericon.png"
                    alt="Other Events"
                  />
                </i>
                <span>Other</span>
              </button>
            </li>
          </ul>
        </div>
      </div>

      <!-- Events Section -->
      <section class="events-container" id="events-container">
        <h3 class="loading-events-header">
          LOADING EVENTS NEAR YOU...
        </h3>
        <svg version="1.1" id="L9" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
          viewBox="0 0 100 100" enable-background="new 0 0 0 0" xml:space="preserve">
            <path fill="#000" d="M73,50c0-12.7-10.3-23-23-23S27,37.3,27,50 M30.9,50c0-10.5,8.5-19.1,19.1-19.1S69.1,39.5,69.1,50">
            <animateTransform 
              attributeName="transform" 
              attributeType="XML" 
              type="rotate"
              dur="1s" 
              from="0 50 50"
              to="360 50 50" 
              repeatCount="indefinite" />
          </path>
        </svg>
      </section>

      <!-- Mobile Filter Panel -->
    <div class="mobile-filter-panel">
      <div class="mobile-filter-header">
        <h2 class="mobile-filter-title">Filters</h2>
        <button class="close-filter">
          <i class="fas fa-times"></i>
        </button>
      </div>
      
      <div class="mobile-filter-group">
        <h3>Distance</h3>
        <div class="mobile-filter-options">
          <div class="filter-option">
            <input type="radio" id="distance-5" name="distance" value="5miles">
            <label for="distance-5">5 miles</label>
          </div>
          <div class="filter-option">
            <input type="radio" id="distance-10" name="distance" value="10miles">
            <label for="distance-10">10 miles</label>
          </div>
          <div class="filter-option">
            <input type="radio" id="distance-25" name="distance" value="25miles">
            <label for="distance-25">25 miles</label>
          </div>
          <div class="filter-option">
            <input type="radio" id="distance-50" name="distance" value="50miles">
            <label for="distance-50">50+ miles</label>
          </div>
        </div>
      </div>
      
      <div class="mobile-filter-group">
        <h3>Date</h3>
        <div class="mobile-filter-options">
          <div class="filter-option">
            <input type="radio" id="date-today" name="date" value="today">
            <label for="date-today">Today</label>
          </div>
          <div class="filter-option">
            <input type="radio" id="date-tomorrow" name="date" value="tomorrow">
            <label for="date-tomorrow">Tomorrow</label>
          </div>
          <div class="filter-option">
            <input type="radio" id="date-week" name="date" value="thisweek">
            <label for="date-week">This Week</label>
          </div>
          <div class="filter-option">
            <input type="radio" id="date-month" name="date" value="thismonth">
            <label for="date-month">This Month</label>
          </div>
        </div>
      </div>
      
      <div class="mobile-filter-group">
        <h3>Admission</h3>
        <div class="mobile-filter-options">
          <div class="filter-option">
            <input type="radio" id="admission-none" name="admission">
            <label for="admission-none">Admission</label>
          </div>
          <div class="filter-option">
            <input type="radio" id="admission-free" name="admission" value="free">
            <label for="admission-free">Free</label>
          </div>
          <div class="filter-option">
            <input type="radio" id="admission-paid" name="admission" value="paid">
            <label for="admission-paid">Paid</label>
          </div>
          <div class="filter-option">
            <input type="radio" id="admission-donation" name="admission" value="donation">
            <label for="admission-donation">Donation</label>
          </div>
        </div>
      </div>
      
      <button class="apply-filters">Apply Filters</button>
    </div>
    

    </main>
    <script src="../../js/scripts.js"></script>
    <script src="../../js/supabase.js"></script>
    <script src="../../js/util/checkUser.js"></script>
    <script src="../../js/main/explore.js"></script>
    <!-- <script src="../../js/auth/logout.js"></script> -->
  </body>
</html>
