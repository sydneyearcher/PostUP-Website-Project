    <!-- Saved Events Section -->
    <main class="events-container">
      <!-- Favorites Tab Content -->
      <ul class="events-tabs">
        <li>
          <button class="tab-button active-tab" data-tab="favorites">Favorites</button>
        </li>
        <li>
          <button class="tab-button" data-tab="tickets">Tickets</button>
        </li>
        <li>
          <button class="tab-button" data-tab="attending">Attending</button>
        </li>
      </ul>
      <section class="tab-content active" id="favorites">
        <h1 class="events-header">YOUR SAVED EVENTS</h1>
        <div class="favorites-container" id="favorites-container">
          <!-- Existing favorites content -->
          <p class="empty-message">LOADING YOUR FAVORITES...</p>
          <svg version="1.1" id="L9" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
            viewBox="0 0 100 100" enable-background="new 0 0 0 0" xml:space="preserve">
              <path fill="#000" d="M73,50c0-12.7-10.3-23-23-23S27,37.3,27,50 M30.9,50c0-10.5,8.5-19.1,19.1-19.1S69.1,39.5,69.1,50">
              <animateTransform 
                attributeName="transform" 
                attributeType="XML" 
                type="rotate"
                dur="1s" 
                from="0 50 50"
                to="360 50 50" 
                repeatCount="indefinite" />
            </path>
          </svg>
        </div>
      </section>

      <!-- Tickets Tab Content -->
      <section class="tab-content" id="tickets">
        <h1 class="events-header">YOUR TICKETS</h1>
        <div class="tickets-container" id="tickets-container">

      <!-- Attending Tab Content -->
      <section class="tab-content" id="attending">
        <h1 class="events-header">EVENTS YOU'RE ATTENDING</h1>
        <div class="attending-container" id="attending-container">
          <div class="event-card attending">
            <div class="status-badge">Attending</div>
            <!-- Existing event card content -->
