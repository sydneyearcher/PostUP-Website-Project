<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PostUP - Ticket Purchased</title>
    <link rel="stylesheet" href="../../css/tickets/purchased.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@100;300;400;500&family=Oswald:wght@400;600&family=Anton&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  </head>
  <body>
    <!-- Logo Positioned Outside Navbar -->
    <div class="nav-logo">
      <a href="index.html"
        ><img src="../../images/PostUp LOGO.png" alt="PostUP Logo"
      /></a>
    </div>

    <main>    
      <div class="ticket-confirmation">
        <h1>YOU GOT YOUR TICKET!</h1>
        <br />
        <h2 id="event-title">
          Nessa Barrett - Aftercare World Tour
        </h2>
        <br />
        <img
          src="../../images/nessabarrett.png"
          alt="Ticket Image"
          class="ticket-image"
        />
        <br />

        <p><strong>Location:</strong> <span id="event-location">The House of Blues</span></p>
        <p><strong >Name:</strong> <span id="username">John Smith</span></p>
        <p><strong>Date:</strong> <span id="event-date">Friday, November 8, 2025</span></p>

        <br />

        <!-- Ticket Barcode -->
        <div class="ticket-barcode">
          <img src="../../images/barcode.png" alt="Ticket Barcode" />
        </div>

        <br />
        <!-- Add to Wallet Button -->
        <div class="wallet-btn-container">
          <button
            class="add-to-wallet-btn"
            onclick="window.location.href='../main/explore.html';"
          >
            <strong>Add to Wallet</strong>
          </button>
        </div>
      </div>
    </main>
    <script src="../../js/supabase.js"></script>
    <script src="../../js/util/checkUser.js"></script>
    <script src="../../js/util/loadEvent.js"></script>
    <script src="../../js/features/purchased.js"></script>
  </body>
</html>
