<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PostUP - Event Overview</title>
    <link rel="stylesheet" href="../../css/events_style/eventOV.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@100;300;400;500&family=Oswald:wght@400;600&family=Anton&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Logo Positioned Outside Navbar -->
    <div class="nav-logo">
      <a href="../main/index.html"
        ><img src="../../images/PostUp LOGO.png" alt="PostUP Logo"
      /></a>
    </div>

    <!-- Event Page -->
    <main class="event-page">
      <!-- Event Overview (Step 1) -->
      <article class="event-overview">
        <br />
        <div class="event-header">
          <a href="../main/explore.html" class="back-btn" id="back-explore-btn">
            <svg class="back-btn-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M15 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Back to Explore
          </a>
          <div>
            <h2>YOU’RE ONE STEP CLOSER!</h2>
            <p>
              Purchase tickets & find out more information about the event below!
            </p>
          </div>
        </div>
        <br />
        <br />
        <img
          src="../../images/nessabarrett.png"
          alt="Event Image"
          class="event-image"
        />
        <br />
        <br />
        <h2>Nessa Barrett</h2>
        <h2>Aftercare World Tour</h2>
        <br />
        <p><strong>Live Music</strong> | <strong>1,500+ Going</strong></p>
        <br />
        <p>
          <strong>Friday, November 8, 2025</strong> |
          <strong>The House of Blues</strong>
        </p>
        <br />
        <p><strong>Doors open at 7:00 PM</strong></p>

        <br />
        <!-- CTA Buttons -->
        <div class="cta-buttons">
          <button class="calendar-btn">
            <strong>Add to My Calendar</strong>
          </button>
          <button class="maps-btn">
            <strong>See Location on Maps</strong>
          </button>
          <button
            class="buy-tickets-btn"
            onclick="window.location.href='../tickets/ticket.html';"
          >
            <strong>Buy Tickets Now</strong>
          </button>
        </div>
      </article>
    </main>
  </body>
</html>
