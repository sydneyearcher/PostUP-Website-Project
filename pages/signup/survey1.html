<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PostUP - Survey</title>
    <link rel="stylesheet" href="../../css/signup_style/survey.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@100;300;400;500&family=Oswald:wght@400;600&family=Anton&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Logo Positioned Outside Navbar -->
    <div class="nav-logo">
      <a href="../main/index.html"><img src="../../images/PostUp LOGO.png" alt="PostUP Logo" /></a>
    </div>

    <form class="survey-form" id="eventtype-form">
        <!-- Survey Box with Border -->
        <div class="survey-box">
          <h2 class="survey-question-title">WHAT TYPE OF EVENTS DO YOU ENJOY THE MOST? <BR> SELECT ONE OR MULTIPLE... <BR> IT'S YOUR MOVE!</h2>
          
          <!-- Event Type Options as Circle Buttons -->
          <div class="circle-group">
            <div class="circle-option" data-value="Music">LIVE <BR> MUSIC</div>
            <div class="circle-option" data-value="Food">FOOD <BR> MARKETS</div>
            <div class="circle-option" data-value="Art">ART <BR> MARKETS</div>
            <div class="circle-option" data-value="Festivals">FESTIVALS</div>
            <div class="circle-option" data-value="Sports">SPORTING <BR> EVENTS</div>
            <div class="circle-option" data-value="Other">OTHER</div>
          </div>
        </div>
      
        <!-- Action Buttons -->
        <div class="form-actions">
          <!-- Button to move to next page -->
        <a href="survey2.html">
          <button type="button" class="submit-btn" data-href="survey2.html">SUBMIT</button>
        </a>
        </div>
      </form>
    <script src="../../js/other/survey.js"></script>
  </body>
</html>
