<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PostUp - Sign Up</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@100;300;400;500&family=Oswald:wght@400;600&family=Anton&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/signup_style/signup.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  </head>
  <body>
    <!-- Main Content Section for Sign Up -->
    <div id="signUpForm">
      <img src="../../images/PostUp LOGO.png" alt="PostUp Logo" class="login-logo" />
      <h1>CREATE YOUR PROFILE</h1>
      <form id="signUpForm">
        <input class="input-field" type="text" placeholder="Full Name" id="signup-full-name"/>
        <input class="input-field" type="text" placeholder="Username" id="signup-username"/>
        <input class="input-field" type="email" placeholder="Email" id="signup-email"/>
        <input class="input-field" type="tel" placeholder="Phone Number" id="signup-phone-number"/>
        <input class="input-field" type="password" placeholder="Password" id="signup-password"/>
        <button class="btn" id="createAccountBtn" type="submit" >CREATE ACCOUNT</button>
      </form>
      <a href="../../index.html" class="btn" id="backToLogin">BACK TO LOGIN</a>
    </div>
    <script src="../../js/supabase.js"></script>
    <script src="../../js/util/checkUser.js"></script>
    <script src="../../js/scripts.js"></script>
    <script src="../../js/auth/signUp.js"></script>
  </body>
</html>
