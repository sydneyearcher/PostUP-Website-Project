<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PostUP - Survey</title>
    <link rel="stylesheet" href="../../css/signup_style/survey.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@100;300;400;500&family=Oswald:wght@400;600&family=Anton&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Logo Positioned Outside Navbar -->
    <div class="nav-logo">
      <a href="../main/index.html"><img src="../../images/PostUp LOGO.png" alt="PostUP Logo" /></a>
    </div>

    <form class="survey-form" id="cuisine-form">
      <!-- Survey Box with Border -->
      <div class="survey-box">
        <h2 class="survey-question-title">
          WHAT TYPE OF CUISINES ARE YOU INTO? <br> SELECT ONE OR MULTIPLE... <br> IT'S YOUR MOVE!
        </h2>
        
        <!-- Cuisine Options as Circle Buttons -->
        <div class="circle-group">
          <div class="circle-option" data-value="Italian">ITALIAN</div>
          <div class="circle-option" data-value="Mexican">MEXICAN</div>
          <div class="circle-option" data-value="Chinese">CHINESE</div>
          <div class="circle-option" data-value="Indian">INDIAN</div>
          <div class="circle-option" data-value="Japanese">JAPANESE</div>
          <div class="circle-option" data-value="Thai">THAI</div>
          <div class="circle-option" data-value="Greek">GREEK</div>
          <div class="circle-option" data-value="American">AMERICAN</div>
        </div>
      </div>
    
      <!-- Action Buttons -->
      <div class="form-actions">
        <!-- Button to move to next page -->
        <a href="survey5.html">
          <button type="submit" class="submit-btn" data-href="survey5.html">SUBMIT</button>
        </a>
      
          <!-- Button to go back to the previous page -->
        <a href="survey3.html">
          <button type="button" class="back-btn">BACK</button>
        </a>
      </div>
    </form>

    <script src="../../js/other/survey.js"></script>
  </body>
</html>
