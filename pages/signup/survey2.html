<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PostUP - Survey</title>
    <link rel="stylesheet" href="../../css/signup_style/survey2.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@100;300;400;500&family=Oswald:wght@400;600&family=Anton&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Logo Positioned Outside Navbar -->
    <div class="nav-logo">
      <a href="../main/index.html"><img src="../../images/PostUp LOGO.png" alt="PostUP Logo" /></a>
    </div>

    <form class="survey-form">
      <!-- Survey Box with Border -->
      <div class="survey-box">
        <h2 class="survey-question-title">
          WHAT KIND OF MUSIC ARE YOU INTO? <br> SELECT ONE OR MULTIPLE... <br> IT'S YOUR MOVE!
        </h2>
        
        <!-- Music Genre Options as Circle Buttons -->
        <div class="circle-group">
          <div class="circle-option" data-value="Rock">ROCK</div>
          <div class="circle-option" data-value="Pop">POP</div>
          <div class="circle-option" data-value="Hip-Hop">HIP-HOP</div>
          <div class="circle-option" data-value="Jazz">JAZZ</div>
          <div class="circle-option" data-value="Classical">CLASSICAL</div>
          <div class="circle-option" data-value="Electronic">ELECTRONIC</div>
          <div class="circle-option" data-value="Country">COUNTRY</div>
          <div class="circle-option" data-value="Other">OTHER</div>
        </div>
      </div>
    
      <!-- Action Buttons -->
      <div class="form-actions">
        <!-- Button to move to next page -->
<a href="survey3.html">
    <button type="submit" class="submit-btn" data-href="survey3.html">SUBMIT</button>
  </a>
  <!-- Button to go back to the previous page -->
<a href="survey1.html">
    <button type="button" class="back-btn">BACK</button>
  </a>
  </div>
    </form>

    <script src="../../js/scripts.js"></script>
  </body>
</html>
