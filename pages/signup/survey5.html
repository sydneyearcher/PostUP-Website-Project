<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PostUP - Survey</title>
    <link rel="stylesheet" href="../../css/signup_style/survey.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@100;300;400;500&family=Oswald:wght@400;600&family=Anton&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Logo Positioned Outside Navbar -->
    <div class="nav-logo">
      <a href="../main/index.html"><img src="../../images/PostUp LOGO.png" alt="PostUP Logo" /></a>
    </div>

    <form class="survey-form" id="artform-form">
      <!-- Survey Box with Border -->
      <div class="survey-box">
        <h2 class="survey-question-title">
          WHICH FORMS OF ART ARE YOU MOST INTO? <br> SELECT ONE OR MULTIPLE... <br> IT'S YOUR MOVE!
        </h2>
        
        <!-- Art Forms Options as Circle Buttons -->
        <div class="circle-group">
          <div class="circle-option" data-value="Painting">PAINTING</div>
          <div class="circle-option" data-value="Sculpture">SCULPTURE</div>
          <div class="circle-option" data-value="Photography">PHOTO-<br>GRAPHY</div>
          <div class="circle-option" data-value="Graffiti">GRAFFITI</div>
          <div class="circle-option" data-value="Dance">DANCE</div>
          <div class="circle-option" data-value="Theater">THEATER</div>
          <div class="circle-option" data-value="Literature">LITERATURE</div>
          <div class="circle-option" data-value="Film">FILM</div>
        </div>
      </div>
    
      <!-- Action Buttons -->
      <div class="form-actions">
        <!-- Button to move to next page -->
      <a href="survey6.html">
        <button type="submit" class="submit-btn" data-href="survey6.html">SUBMIT</button>
      </a>
      
          <!-- Button to go back to the previous page -->
      <a href="survey4.html">
        <button type="button" class="back-btn">BACK</button>
      </a>
      </div>
  
    </form>

    <script src="../../js/other/survey.js"></script>
  </body>
</html>
