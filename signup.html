<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PostUp - Sign Up</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@100;300;400;500&family=Oswald:wght@400;600&family=Anton&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="signup.css" />
  </head>
  <body>
    <!-- Main Content Section for Sign Up -->
    <div id="signUpForm">
      <img src="images/PostUp LOGO.png" alt="PostUp Logo" class="login-logo" />
      <h1>CREATE YOUR PROFILE</h1>
      <div id="signUpForm">
        <input class="input-field" type="text" placeholder="Full Name" />
        <input class="input-field" type="text" placeholder="Username" />
        <input class="input-field" type="email" placeholder="Email" />
        <input class="input-field" type="tel" placeholder="Phone Number" />
        <input class="input-field" type="password" placeholder="Password" />
        <button class="btn" id="createAccountBtn">CREATE ACCOUNT</button>
        <a href="index.html" class="btn" id="backToLogin">BACK TO LOGIN</a>
      </div>
    </div>
    <script src="scripts.js"></script>
  </body>
</html>
