      <a href="../events/livemusic.html" class="filter-link">

        </div>

      <a href="../events/foodmarkets.html" class="filter-link">

          />

        </div>
      </a>

      <!-- Art Markets -->
      <a href="../events/artmarkets.html" class="filter-link">
        <div class="filter-item">
          <img src="../../images/articon.png" alt="Art Market" class="filter-icon" />

        </div>
      </a>

      <!-- Festivals -->
      <a href="../events/festivals.html" class="filter-link">
        <div class="filter-item">
          <img
            src="../../images/festivalicon.png"
            alt="Festivals"
            class="filter-icon"

        </div>

      <!-- Sports -->
      <a href="../events/sporting.html" class="filter-link">

        </div>
      </a>

      <!-- Other -->
      <a href="../events/other.html" class="filter-link">

          <img
            src="../../images/othericon.png"
            alt="Other Events"
            class="filter-icon"
          />
          <span>Other</span>
        </div>
      </a>
    </section>
