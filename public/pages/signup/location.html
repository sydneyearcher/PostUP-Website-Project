<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PostUp - Enable Location</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@100;300;400;500&family=Oswald:wght@400;600&family=Anton&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/signup_style/location.css" />
  </head>
  <body>
    <!-- Main Content Section for Location Page -->
    <div id="locationPage">
      <!-- Logo -->
      <div class="logo-container">
        <img src="../../images/PostUp LOGO.png" alt="PostUp Logo" class="logo" />
      </div>

      <!-- Location Image Section -->
      <div class="location-image-container">
        <img
          src="../../images/location.png"
          alt="Location Image"
          class="location-image"
        />
      </div>

      <!-- Enable Location Text -->
      <div class="enable-location-text">
        <h1>ENABLE <br />LOCATION</h1>
        <br />
        <br />
        <p>PLEASE ENABLE YOUR LOCATION FOR USING THE APP SMOOTHLY</p>
      </div>

      <br />
      <br />
      <br />
      <br />

      <!-- Allow Location Button -->
      <button id="allowLocationBtn" class="allow-btn">ALLOW LOCATION</button>

      <br />
      <br />
      <!-- Maybe Later Link -->
      <p><a href="#" id="maybeLater" class="maybe-later">MAYBE LATER</a></p>
    </div>

    <script src="../../js/scripts.js"></script>
  </body>
</html>
