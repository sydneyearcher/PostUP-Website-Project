<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PostUP - Survey</title>
    <link rel="stylesheet" href="../../css/signup_style/survey3.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@100;300;400;500&family=Oswald:wght@400;600&family=Anton&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Logo Positioned Outside Navbar -->
    <div class="nav-logo">
      <a href="../main/index.html"><img src="../../images/PostUp LOGO.png" alt="PostUP Logo" /></a>
    </div>

    <form class="survey-form">
      <!-- Survey Box with Border -->
      <div class="survey-box">
        <h2 class="survey-question-title">
          WHAT KINDS OF FOOD ARE YOU INTO? <br> SELECT ONE OR MULTIPLE... <br> IT'S YOUR MOVE!
        </h2>
        
        <!-- Food Options as Circle Buttons -->
        <div class="circle-group">
          <div class="circle-option" data-value="Pizza">PIZZA</div>
          <div class="circle-option" data-value="Burgers">BURGERS</div>
          <div class="circle-option" data-value="Sushi">SUSHI</div>
          <div class="circle-option" data-value="Tacos">TACOS</div>
          <div class="circle-option" data-value="Salads">SALADS</div>
          <div class="circle-option" data-value="Pasta">PASTA</div>
          <div class="circle-option" data-value="Desserts">DESSERTS</div>
          <div class="circle-option" data-value="Vegan">VEGAN</div>
        </div>
      </div>
    
      <!-- Action Buttons -->
      <div class="form-actions">
        <!-- Button to move to next page -->
    <a href="survey4.html">
    <button type="submit" class="submit-btn" data-href="survey4.html">SUBMIT</button>
    </a>
  
    <!-- Button to go back to the previous page -->
    <a href="survey2.html">
      <button type="button" class="back-btn">BACK</button>
    </a>
  
    </form>

    <script src="../../js/scripts.js"></script>
  </body>
</html>
