<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PostUP - Explore</title>
    <link rel="stylesheet" href="explore.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@100;300;400;500&family=Oswald:wght@400;600&family=Anton&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Logo Positioned Outside Navbar -->
    <div class="nav-logo">
      <a href="index.html"
        ><img src="images/PostUp LOGO.png" alt="PostUP Logo"
      /></a>
    </div>

    <!-- Navigation Bar -->
    <div class="navbar-container">
      <nav class="navbar">
        <ul class="nav-links">
          <li><a href="explore.html" class="active">EXPLORE</a></li>
          <li><a href="#">EVENTS</a></li>
          <li><a href="profile.html" class="profile-btn">PROFILE</a></li>
          <li><a href="index.html" class="logout-btn">LOGOUT</a></li>
        </ul>
      </nav>
    </div>

    <!-- Header for Explore Page -->
    <h1 class="explore-header">Explore Page</h1>

    <!-- Search Bar -->
    <div class="search-container">
      <input
        type="text"
        class="search-bar"
        placeholder="Search for events..."
      />
      <button class="search-btn">Search</button>
    </div>

    <!-- Category Filters -->
    <div class="filter-container">
      <div class="filter-item" id="live-music">
        <img src="images/musiclogo.png" alt="Live Music" class="filter-icon" />
        <span>Live Music</span>
      </div>
      <div class="filter-item" id="food-markets">
        <img src="images/foodicon.png" alt="Food Markets" class="filter-icon" />
        <span>Food Markets</span>
      </div>
      <div class="filter-item" id="art-markets">
        <img src="images/articon.png" alt="Art Markets" class="filter-icon" />
        <span>Art Markets</span>
      </div>
      <div class="filter-item" id="festivals">
        <img
          src="images/festivalicon.png"
          alt="Festivals"
          class="filter-icon"
        />
        <span>Festivals</span>
      </div>
      <div class="filter-item" id="sporting-events">
        <img
          src="images/sporticon.png"
          alt="Sporting Events"
          class="filter-icon"
        />
        <span>Sporting Events</span>
      </div>
      <div class="filter-item" id="other">
        <img src="images/othericon.png" alt="Other" class="filter-icon" />
        <span>Other</span>
      </div>
    </div>

    <!-- Events Section -->
    <div class="events-container">
      <div class="event-box">
        <img
          src="images/live-music.jpg"
          alt="Live Music Event"
          class="event-image"
        />
        <p class="event-title">Live Music Show</p>
      </div>

      <div class="event-box">
        <img
          src="images/food-market.jpg"
          alt="Food Market Event"
          class="event-image"
        />
        <p class="event-title">Food Market</p>
      </div>

      <div class="event-box">
        <img
          src="images/art-market.jpg"
          alt="Art Market Event"
          class="event-image"
        />
        <p class="event-title">Art Market</p>
      </div>

      <div class="event-box">
        <img
          src="images/art-market.jpg"
          alt="Art Market Event"
          class="event-image"
        />
        <p class="event-title">Art Market</p>
      </div>

      <div class="event-box">
        <img
          src="images/art-market.jpg"
          alt="Art Market Event"
          class="event-image"
        />
        <p class="event-title">Art Market</p>
      </div>

      <div class="event-box">
        <img
          src="images/art-market.jpg"
          alt="Art Market Event"
          class="event-image"
        />
        <p class="event-title">Art Market</p>
      </div>
    </div>

    <script src="scripts.js"></script>
  </body>
</html>
